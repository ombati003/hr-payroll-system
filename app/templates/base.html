<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vunoh ltd HR & Payroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#0F172A] text-white flex flex-col">
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl">HR</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Vunoh ltd</h1>
                    <p class="text-xs text-slate-400">HR & Payroll</p>
                </div>
            </div>
            
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors active-nav" id="nav-dashboard">
                    <i class="fa-solid fa-table-columns w-5"></i> Dashboard
                </a>
                <a href="/employees" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-employees">
                    <i class="fa-solid fa-users w-5"></i> Employees
                </a>
                <a href="/teams" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-teams">
                    <i class="fa-solid fa-user-group w-5"></i> Teams
                </a>
                <a href="/leave" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-leave">
                    <i class="fa-solid fa-calendar-days w-5"></i> Leave Management
                </a>
                <a href="/payroll" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-payroll">
                    <i class="fa-solid fa-dollar-sign w-5"></i> Payroll
                </a>
                <a href="/payslips" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-payslips">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i> Payslips
                </a>
                <a href="/reports" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-reports">
                    <i class="fa-solid fa-chart-line w-5"></i> Reports
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 transition-colors" id="nav-settings">
                    <i class="fa-solid fa-gear w-5"></i> Settings
                </a>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3 p-2">
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold">LT</div>
                    <div class="flex-1 overflow-hidden">
                        <p class="font-medium truncate">Linda Torres</p>
                        <p class="text-xs text-slate-400 truncate">HR Director</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Topbar -->
            <header class="h-16 bg-white border-b flex items-center justify-between px-8">
                <h2 class="text-xl font-bold" id="page-title">Dashboard</h2>
                
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" placeholder="Search employees, payslips..." class="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm w-64 focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="flex items-center gap-2 text-slate-500 text-sm">
                        <i class="fa-solid fa-calendar"></i>
                        <span id="current-date">Monday, July 27, 2026</span>
                    </div>

                    <div class="flex items-center gap-4">
                        <button class="w-10 h-10 rounded-full hover:bg-slate-100 transition-colors"><i class="fa-solid fa-moon"></i></button>
                        <button class="w-10 h-10 rounded-full hover:bg-slate-100 transition-colors relative">
                            <i class="fa-solid fa-bell"></i>
                            <span class="absolute top-2 right-2 w-4 h-4 bg-red-500 text-white text-[10px] flex items-center justify-center rounded-full border-2 border-white">2</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Body -->
            <div class="flex-1 overflow-y-auto p-8" id="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
