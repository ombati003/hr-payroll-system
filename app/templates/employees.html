{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-8">
    <div>
        <h3 class="text-2xl font-bold">Employees</h3>
        <p class="text-slate-500">Manage your team members and their records.</p>
    </div>
    <button onclick="openAddEmployeeModal()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">
        <i class="fa-solid fa-plus mr-2"></i> Add Employee
    </button>
</div>

<div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
    <table class="w-full text-left">
        <thead class="bg-slate-50 border-b border-slate-100">
            <tr>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Employee</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Role & Team</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Start Date</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Salary</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Status</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-right">Actions</th>
            </tr>
        </thead>
        <tbody id="employee-table-body" class="divide-y divide-slate-100">
            <!-- Employees will be loaded here -->
        </tbody>
    </table>
</div>

<!-- Simple Org View Placeholder -->
<div class="mt-12">
    <h4 class="text-xl font-bold mb-6">Organization Hierarchy</h4>
    <div id="org-view" class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm min-h-[300px] flex items-center justify-center">
        <p class="text-slate-400">Loading hierarchy...</p>
    </div>
</div>

<!-- Modal for adding employee -->
<div id="add-employee-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl w-full max-w-2xl p-8">
        <h3 class="text-2xl font-bold mb-6">Add New Employee</h3>
        <form id="add-employee-form" class="grid grid-cols-2 gap-6">
            <div class="col-span-2">
                <label class="block text-sm font-bold mb-2">Full Name</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Role</label>
                <input type="text" name="role" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Team</label>
                <select name="team_id" id="team-select" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Manager</label>
                <select name="manager_id" id="manager-select" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">No Manager</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Start Date</label>
                <input type="date" name="start_date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Monthly Salary ($)</label>
                <input type="number" name="salary" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Employment Type</label>
                <select name="employment_type" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                </select>
            </div>
            <div class="col-span-2 flex justify-end gap-4 mt-4">
                <button type="button" onclick="closeAddEmployeeModal()" class="px-6 py-2 text-slate-500 font-bold">Cancel</button>
                <button type="submit" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold hover:bg-blue-700">Save Employee</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function loadEmployees() {
        fetch('/api/employees/')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('employee-table-body');
                tbody.innerHTML = '';
                const managerSelect = document.getElementById('manager-select');
                managerSelect.innerHTML = '<option value="">No Manager</option>';
                
                data.forEach(emp => {
                    const row = `
                        <tr>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-500">${emp.name.substring(0,2).toUpperCase()}</div>
                                    <div>
                                        <p class="font-bold">${emp.name}</p>
                                        <p class="text-xs text-slate-400">${emp.email}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm font-medium">${emp.role}</p>
                                <p class="text-xs text-slate-400">${emp.team || 'No Team'}</p>
                            </td>
                            <td class="px-6 py-4 text-sm">${emp.start_date}</td>
                            <td class="px-6 py-4 text-sm font-bold">$${emp.salary.toLocaleString()}</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${emp.status === 'Active' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">
                                    ${emp.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                    managerSelect.innerHTML += `<option value="${emp.id}">${emp.name}</option>`;
                });
                
                // Build a simple org view
                buildOrgView(data);
            });
    }

    function buildOrgView(employees) {
        const orgView = document.getElementById('org-view');
        orgView.innerHTML = '';
        const managers = employees.filter(e => !e.manager_id);
        
        const container = document.createElement('div');
        container.className = 'flex flex-wrap gap-8 justify-center';
        
        managers.forEach(mgr => {
            const mgrCard = document.createElement('div');
            mgrCard.className = 'p-4 border rounded-xl bg-slate-50 text-center min-w-[150px]';
            mgrCard.innerHTML = `<p class="font-bold">${mgr.name}</p><p class="text-xs text-slate-400">${mgr.role}</p>`;
            
            const subordinates = employees.filter(e => e.manager_id === mgr.id);
            if (subordinates.length > 0) {
                const subContainer = document.createElement('div');
                subContainer.className = 'mt-4 pl-4 border-l-2 border-slate-200 space-y-2';
                subordinates.forEach(sub => {
                    subContainer.innerHTML += `<div class="p-2 border rounded-lg bg-white text-xs"><p class="font-bold">${sub.name}</p><p>${sub.role}</p></div>`;
                });
                mgrCard.appendChild(subContainer);
            }
            container.appendChild(mgrCard);
        });
        orgView.appendChild(container);
    }

    function loadTeams() {
        fetch('/api/employees/teams')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('team-select');
                select.innerHTML = '';
                data.forEach(team => {
                    select.innerHTML += `<option value="${team.id}">${team.name}</option>`;
                });
            });
    }

    function openAddEmployeeModal() {
        document.getElementById('add-employee-modal').classList.remove('hidden');
        document.getElementById('add-employee-modal').classList.add('flex');
    }

    function closeAddEmployeeModal() {
        document.getElementById('add-employee-modal').classList.add('hidden');
        document.getElementById('add-employee-modal').classList.remove('flex');
    }

    document.getElementById('add-employee-form').onsubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.from_ホームページ(formData.entries());
        
        fetch('/api/employees/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(res => {
            if (res.ok) {
                closeAddEmployeeModal();
                loadEmployees();
                e.target.reset();
            }
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        loadEmployees();
        loadTeams();
    });
</script>
{% endblock %}
